name: CI

# Только конвертер валют: без paths этот workflow запускался на любой push, в том числе гостевого бота (S08).
on:
  push:
    branches: [main]
    paths:
      - "apps/01-currency-bot/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/01-currency-bot/**"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter currency-converter-bot typecheck
      - run: pnpm --filter currency-converter-bot test
